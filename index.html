<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>原寶，原住民族學生資訊百科</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
<script>
  // 先套用使用者在「外觀」選過的設定，避免載入時閃一下
  try {
    const a = JSON.parse(localStorage.getItem("appearance") || "{}"), r = document.documentElement;
    if (a.font && a.font !== "standard") r.dataset.font = a.font;
    if (a.width && a.width !== "standard") r.dataset.width = a.width;
    if (a.theme && a.theme !== "auto") r.dataset.theme = a.theme;
  } catch (e) {}
</script>
<style>
:root{
  --bg:#ffffff; --ink:#202122; --muted:#54595d; --line:#c8ccd1; --soft:#f8f9fa;
  --link:#3366cc; --link-visited:#795cb2; --link-hover:#2a4b8d;
  --banner:linear-gradient(180deg,#fbfcff 0%,#eef3fc 100%); --banner-line:#a7d7f9;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --page:1780px; --scale:1;
  color-scheme:light;
  box-sizing:border-box;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --bg:#101418; --ink:#eaecf0; --muted:#a2a9b1; --line:#54595d; --soft:#1b2026; --link:#88a3e8; --link-visited:#a799cd; --link-hover:#b0c3f2; --banner:linear-gradient(180deg,#141a22 0%,#18243a 100%); --banner-line:#3e5a8a; color-scheme:dark; }
}
:root[data-font="small"]{--scale:.9}
:root[data-font="large"]{--scale:1.15}
:root[data-width="wide"]{--page:100%}
:root[data-theme="dark"]{ --bg:#101418; --ink:#eaecf0; --muted:#a2a9b1; --line:#54595d; --soft:#1b2026; --link:#88a3e8; --link-visited:#a799cd; --link-hover:#b0c3f2; --banner:linear-gradient(180deg,#141a22 0%,#18243a 100%); --banner-line:#3e5a8a; color-scheme:dark; }
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:calc(16px * var(--scale));line-height:1.75}
a{color:var(--link);text-decoration:none}
a:visited{color:var(--link-visited)}
a:hover{color:var(--link-hover);text-decoration:underline;text-underline-offset:2px}
.logo,.logo:visited,.logo:hover{color:var(--ink);text-decoration:none}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
button,input,textarea{font:inherit;color:inherit}

/* ===== 頂部（仿 Wikipedia：選單、標誌、搜尋、右側連結） ===== */
.hd{padding-top:env(safe-area-inset-top,0px)}
.hd-in{max-width:var(--page);margin:0 auto;padding:14px 32px;display:flex;align-items:center;gap:20px}
.menu{position:relative}
.icon-btn{display:grid;place-items:center;width:40px;height:40px;background:none;border:0;border-radius:4px;cursor:pointer}
.icon-btn:hover{background:var(--soft)}
.burger{background:var(--ink)}
.burger{display:block;width:20px;height:2px;background:var(--ink);box-shadow:0 -6px 0 var(--ink),0 6px 0 var(--ink)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none}
.mark{display:grid;place-items:center;width:48px;height:48px;border:2px solid var(--ink);border-radius:50%;font-family:var(--serif);font-weight:700;font-size:calc(26px * var(--scale));line-height:1}
.wm{display:flex;flex-direction:column;line-height:1.2}
.wm b{font-family:var(--serif);font-weight:700;font-size:calc(25px * var(--scale));letter-spacing:.18em}
.wm small{font-family:var(--serif);font-size:calc(13px * var(--scale));letter-spacing:.04em}
.search{flex:0 1 620px;display:flex;margin-left:12px}
.search input{flex:1;min-width:0;height:44px;padding:0 14px;border:1px solid var(--muted);border-right:0;border-radius:4px 0 0 4px;background:var(--bg);font-size:calc(16px * var(--scale))}
.search input:focus{outline:none;border-color:var(--link);box-shadow:inset 0 0 0 1px var(--link)}
.search button{padding:0 20px;border:1px solid var(--muted);border-radius:0 4px 4px 0;background:var(--soft);font-weight:700;font-size:calc(15px * var(--scale));cursor:pointer}
.search button:hover{background:var(--bg);border-color:var(--ink)}
.usr{margin-left:auto;display:flex;align-items:center;gap:16px;font-size:calc(15px * var(--scale));position:relative;white-space:nowrap}
.usr a{text-decoration:none}
.usr a:hover{text-decoration:underline}
.appear-btn{background:none;border:1px solid var(--line);border-radius:4px;padding:4px 10px;font-size:calc(14px * var(--scale));cursor:pointer}
.appear-btn[hidden]{display:none}
.dropdown{position:absolute;top:calc(100% + 6px);z-index:50;background:var(--bg);border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.18);padding:12px 16px;min-width:220px}
.dropdown[hidden]{display:none}
.dropdown.left{left:0}
.dropdown.right{right:0}
.dropdown .dh{font-size:calc(13px * var(--scale));color:var(--muted);margin:8px 0 2px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.dropdown .dh:first-child{margin-top:0}
.dropdown a{display:block;padding:4px 0;text-decoration:none;font-size:calc(15px * var(--scale))}
.dropdown a:hover{text-decoration:underline}

/* 網站公告（仿 Wikipedia 頂部那條置中公告） */
.notice{max-width:var(--page);margin:0 auto;padding:6px 72px 14px;text-align:center;font-size:calc(15px * var(--scale));position:relative}
.notice[hidden]{display:none}
.notice .x{position:absolute;right:32px;top:2px;width:32px;height:32px;background:none;border:0;cursor:pointer;font-size:calc(22px * var(--scale));line-height:1}

/* ===== 版面：目錄｜內容｜外觀 ===== */
.page{max-width:var(--page);margin:0 auto;padding:0 32px;display:grid;grid-template-columns:minmax(0,1fr);gap:40px;align-items:start}
body.has-toc .page{grid-template-columns:200px minmax(0,1fr)}
body.has-tools .page{grid-template-columns:minmax(0,1fr) 210px}
body.has-toc.has-tools .page{grid-template-columns:200px minmax(0,1fr) 210px}
.toc,.tools{display:none;position:sticky;top:16px;font-size:calc(14px * var(--scale));line-height:1.6;padding-top:8px}
body.has-toc .toc,body.has-tools .tools{display:block}
.side-h{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:calc(15px * var(--scale));padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:8px}
.side-h button{background:var(--soft);border:0;border-radius:3px;padding:1px 8px;font-size:calc(13px * var(--scale));cursor:pointer;font-weight:400}
.toc ul{list-style:none;margin:0;padding:0}
.toc li{margin:5px 0}
.toc a{text-decoration:none}
.toc a:hover{text-decoration:underline}
.ap fieldset{border:0;margin:0 0 14px;padding:0}
.ap legend{font-size:calc(14px * var(--scale));width:100%;padding:0 0 4px;margin-bottom:4px;border-bottom:1px solid var(--line)}
.ap label{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:calc(15px * var(--scale));cursor:pointer}
.ap input{accent-color:var(--ink);width:17px;height:17px;margin:0}
main{min-width:0;padding-bottom:64px}

/* 分頁標籤（首頁｜閱讀 檢視原始碼 檢視歷史） */
.tabs{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;border-bottom:1px solid var(--line);margin:0 0 16px;font-size:calc(15px * var(--scale))}
.tabs div{display:flex;gap:20px}
.tabs a{text-decoration:none;padding:6px 0 5px;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs a:hover{text-decoration:underline}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:700}
.tabs a[aria-current="page"]:hover{text-decoration:none}

/* ===== 首頁 ===== */
.banner{display:grid;grid-template-columns:200px minmax(0,1fr) auto;align-items:center;gap:24px;background:var(--banner);border-bottom:1px solid var(--banner-line);overflow:hidden;min-height:150px;padding-right:28px;margin-bottom:26px}
.globe{position:relative;height:150px}
.globe span{position:absolute;left:-30px;top:-10px;width:190px;height:190px;border:3px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:calc(96px * var(--scale));line-height:1}
.banner h1{color:var(--link);font-family:var(--sans);font-weight:700;font-size:calc(46px * var(--scale));line-height:1.15;margin:0 0 8px;letter-spacing:.06em}
.banner p{margin:0;font-size:calc(16px * var(--scale));line-height:1.7}
.stats{text-align:center}
.stats .n{font-size:calc(20px * var(--scale));margin:0 0 4px;font-weight:700;color:var(--link)}
.stats .n b{font-size:calc(22px * var(--scale));letter-spacing:.02em;margin:0 3px}
.stats nav{display:grid;grid-template-columns:repeat(3,auto);gap:2px 28px;justify-content:center;font-size:calc(17px * var(--scale))}
.stats nav a{text-decoration:none}
.stats nav a:hover{text-decoration:underline}
.mp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px;align-items:start}
.mp h2{font-family:var(--sans);font-weight:700;font-size:calc(21px * var(--scale));letter-spacing:.15em;margin:0 0 14px}
.mp-l h2{color:var(--link-hover)}
.mp-l section{padding:0 0 22px;margin:0 0 22px;border-bottom:1px solid var(--line)}
.mp-l section:last-child{border-bottom:0}
.mp-r{border:1px solid var(--line);padding:22px 28px}
.mp-r section{margin:0 0 22px}
.mp ul{padding-left:1.2em;margin:0 0 12px}
.mp li{margin:6px 0}
.mp .tablewrap{margin:12px 0 0}
.mp .line{margin:6px 0;font-size:calc(15.5px * var(--scale))}
.mp .line b{font-weight:700}
.mp .foot{text-align:right;font-size:calc(14px * var(--scale));margin:10px 0 0}
.mp .other{font-size:calc(15px * var(--scale));margin:12px 0 0}
.mp .other b{font-weight:700}

/* ===== 條目 ===== */
.ptitle{font-family:var(--serif);font-weight:500;font-size:calc(clamp(26px,4vw,32px) * var(--scale));line-height:1.3;margin:0;padding:8px 0 4px}
.from{font-size:calc(14px * var(--scale));color:var(--muted);margin:0 0 18px}
.body h1{display:none}
.body h2{font-family:var(--serif);font-weight:500;font-size:calc(24px * var(--scale));line-height:1.4;margin:28px 0 10px;padding-bottom:3px;border-bottom:1px solid var(--line)}
.body ul,.body ol{padding-left:1.6em}
.body li{margin:4px 0}
.body strong{font-weight:700}
.body code{font-size:.88em;background:var(--soft);padding:1px 5px;border-radius:3px;word-break:break-all}
.body pre{background:var(--soft);padding:14px;overflow-x:auto;font-size:calc(14px * var(--scale));line-height:1.6}
.body img{max-width:100%;height:auto;display:block;border:1px solid var(--line);margin:14px 0}
.tablewrap{overflow-x:auto;margin:14px 0}
table{border-collapse:collapse;font-size:calc(15px * var(--scale));line-height:1.6;background:var(--bg)}
.body table{border:1px solid var(--line)}
th,td{text-align:left;padding:7px 12px;border:1px solid var(--line);vertical-align:top}
th{font-weight:700;background:var(--soft)}
.mp table{width:100%}
.mp th,.mp td{border-width:0 0 1px}
.cats{margin:36px 0 0;border:1px solid var(--line);background:var(--soft);padding:8px 12px;font-size:calc(14px * var(--scale));line-height:1.9}
.cats b{font-weight:700}
.src-note{font-size:calc(15px * var(--scale));margin:0 0 12px}
.src-box{width:100%;min-height:440px;padding:10px;border:1px solid var(--line);background:var(--soft);font-family:ui-monospace,Consolas,"Noto Sans Mono",monospace;font-size:calc(14px * var(--scale));line-height:1.6;resize:vertical}

/* ===== 提問結果 ===== */
.ask-line{font-size:calc(16px * var(--scale));margin:0 0 16px}
.answer{border:2px solid var(--link);padding:16px 20px;margin:0 0 28px}
.answer.nodata{border-style:dashed;border-color:var(--ink)}
.answer.offtopic{border:1px solid var(--line)}
.answer .label{font-size:calc(14px * var(--scale));font-weight:700;margin:0 0 6px}
.answer .text{margin:0;font-size:calc(17px * var(--scale))}
.answer.offtopic .text{color:var(--muted)}
.answer .src{margin:10px 0 0;font-size:calc(15px * var(--scale))}
.answer .note{margin:8px 0 0;font-size:calc(13px * var(--scale));color:var(--muted)}
.answer .wait{margin:0;color:var(--muted)}
.results h2{font-size:calc(15px * var(--scale));font-weight:700;margin:0 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.results ul{list-style:none;padding:0;margin:0}
.results li{margin:0 0 16px}
.results li a{font-size:calc(17px * var(--scale))}
.results mark{color:inherit}
.results li p{margin:2px 0 0;font-size:calc(15px * var(--scale));line-height:1.6}
.results li small{color:var(--muted);font-size:calc(13px * var(--scale))}
.results mark{background:none;color:inherit;font-weight:700}

/* ===== 頁尾 ===== */
footer{max-width:var(--page);margin:0 auto;padding:0 32px 40px;font-size:calc(13.5px * var(--scale));line-height:1.8}
footer .in{border-top:1px solid var(--line);padding-top:16px}
footer p{margin:0 0 8px}
footer nav a{margin-right:16px}

/* ===== 較窄的螢幕 ===== */
@media (max-width:1000px){
  body.has-toc .page{grid-template-columns:minmax(0,1fr)}
  body.has-toc .toc{display:none}
  .mp{grid-template-columns:minmax(0,1fr)}
  .banner{grid-template-columns:150px minmax(0,1fr)}
  .stats{grid-column:1 / -1;padding:0 0 18px 24px;text-align:left}
  .stats nav{justify-content:start}
}
@media (max-width:720px){
  .hd-in{flex-wrap:wrap;gap:8px 10px;padding:10px 12px}
  .mark{width:38px;height:38px;font-size:calc(20px * var(--scale))}
  .wm b{font-size:calc(20px * var(--scale))}
  .wm small{font-size:calc(12px * var(--scale))}
  .search{order:3;flex:1 1 100%;margin:0}
  .usr a{display:none}
  .notice{padding:4px 44px 10px 14px;text-align:left;font-size:calc(14px * var(--scale))}
  .notice .x{right:8px}
  .page{padding:0 12px}
  footer{padding:0 12px 32px}
  .banner{grid-template-columns:minmax(0,1fr);padding:18px 16px;gap:10px}
  .globe{display:none}
  .banner h1{font-size:calc(34px * var(--scale))}
  .stats{padding:0}
  .mp-r{padding:16px}
  .tabs{font-size:calc(14px * var(--scale))}
  .tabs div{gap:12px}
}
</style>
</head>
<body>
<header class="hd">
  <div class="hd-in">
    <div class="menu">
      <button class="icon-btn" id="menuBtn" type="button" aria-label="主選單" aria-expanded="false" aria-controls="menuPanel"><span class="burger" aria-hidden="true"></span></button>
      <nav class="dropdown left" id="menuPanel" hidden aria-label="主選單">
        <p class="dh">導覽</p>
        <a href="#/">首頁</a>
        <a href="#/index">全部條目</a>

      </nav>
    </div>

    <form class="search" id="topform" role="search" autocomplete="off"><input id="topq" type="search" placeholder="在原寶提問" aria-label="在原寶提問" autocomplete="off" spellcheck="false"><button type="submit">提問</button></form>

      <button class="appear-btn" id="appearBtn" type="button" aria-expanded="false" aria-controls="appearDrop" hidden>外觀</button>

<div class="notice" id="notice" hidden><span id="noticeText"></span><button class="x" id="noticeX" type="button" aria-label="關閉公告">×</button></div>
<div class="page">

  <nav><a href="#/%E9%97%9C%E6%96%BC%E5%8E%9F%E5%AF%B6">關於原寶</a><a href="#/index">全部條目</a><a href="#/log">操作紀錄</a><a href="#/%E5%BE%85%E7%A2%BA%E8%AA%8D%E4%BA%8B%E9%A0%85">待確認事項</a></nav>

<!-- 外觀面板：寬螢幕固定在右側欄，窄螢幕或按「隱藏」後收進右上角的「外觀」按鈕 -->

      <label><input type="radio" name="font" value="small">小</label>

      <label><input type="radio" name="theme" value="auto">自動</label>
      <label><input type="radio" name="theme" value="light">淺色</label>
      <label><input type="radio" name="theme" value="dark">深色</label>
    </fieldset>

<script src="assets/marked.min.js"></script>
<script>
// ===== 設定 =====
// AI 問答的網址。部署在 Vercel 時維持 "/api/ask" 即可。改成 "" = 關閉 AI，只用關鍵字搜尋
const ASK_API = "/api/ask";
// 截止時間：頂部公告與首頁「最新消息」第一則會依這裡自動倒數
const DEADLINES = {online:new Date("2026-10-14T23:59:00+08:00"), paper:new Date("2026-10-15T17:00:00+08:00")};
// ================

const SITE = "原寶";
const PAGES = {};
let order = [];
const backlinks = {};
const HOME = "總覽";
const TYPES = {concept:"主題", entity:"單位", query:"問答與檢查", source:"來源", meta:"紀錄", about:"關於"};
const LABEL = {index:"全部條目", log:"操作紀錄"};
const label = t => LABEL[t] || t;

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
const href = t => t === HOME ? "#/" : `#/${encodeURIComponent(t)}`;
const link = (t, text) => `<a href="${href(t)}">${esc(text || label(t).replace(/^來源-/,"來源："))}</a>`;
function wikify(md){ return md.replace(/\[\[(.+?)\]\]/g,(m,t)=> PAGES[t] ? link(t) : esc(t)); }
function render(md){
  const src = wikify(md);
  const html = window.marked ? marked.parse(src,{gfm:true,breaks:false,mangle:false,headerIds:false}) : "<pre>"+src+"</pre>";
  return html.replace(/<table>/g,'<div class="tablewrap"><table>').replace(/<\/table>/g,'</table></div>');
}

function parsePage(txt){
  const m = txt.replace(/\r\n/g,"\n").match(/^---\n([\s\S]*?)\n---\n([\s\S]*)$/);
  if (!m) return null;
  const fm = {};
  for (const line of m[1].split("\n")){
    const i = line.indexOf(":"); if (i<0) continue;
    const k = line.slice(0,i).trim(), v = line.slice(i+1).trim();
    fm[k] = v.startsWith("[") ? v.slice(1,-1).split(",").map(x=>x.trim()).filter(Boolean) : v;
  }
  return {title:fm.title, type:fm.type||"concept", sources:fm.sources||[], updated:fm.updated||"", body:m[2]};
}
async function load(){
  const list = await (await fetch("wiki/pages.json",{cache:"no-cache"})).json();
  const texts = await Promise.all(list.map(p => fetch("wiki/"+encodeURI(p),{cache:"no-cache"}).then(r => r.ok ? r.text() : "")));
  texts.forEach((txt, i) => { const p = parsePage(txt); if (p && p.title){ p.path = list[i]; p.raw = txt; PAGES[p.title] = p; order.push(p.title); } });
  for (const t of order){ for (const m of PAGES[t].body.matchAll(/\[\[(.+?)\]\]/g)){ (backlinks[m[1]] ||= new Set()).add(t); } }
}

// ---------- 搜尋 ----------
const STOPCH = new Set([..."嗎呢吧啊的了是我你妳他她要有在能會可以和與及或問什麼怎如何哪裡多少還都也就嗎那這個些想該"]);
const SYN = [[/研究所|研究生|碩士|博士/g,"碩博士"],[/多少錢|金額多少|領多少|幾塊/g,"金額"],[/期限|最後一天|deadline/gi,"截止"],[/低收入|中低收|低收/g,"低收入戶"],[/影本|copy/gi,"影本"],[/服務時數|時數/g,"時數"],[/達悟/g,"雅美"],[/一起|同時|兩個都|都領|兼領/g,"同時"],[/原資中心|原資/g,"原住民族學生資源中心"]];
let IDX = null;
const plain = md => md.replace(/^---[\s\S]*?---/,"").replace(/\[\[(.+?)\]\]/g,"$1").replace(/!\[[^\]]*\]\([^)]*\)/g,"").replace(/\[([^\]]+)\]\([^)]*\)/g,"$1").replace(/^\s*(?:[-+]|\d+\.)\s+/gm,"").replace(/[#*|`>]/g," ").replace(/-{3,}/g," ");
function buildIndex(){
  const norm = x => SYN.reduce((a, [re, to]) => a.replace(re, to), x).toLowerCase();
  const docs = order.filter(t => t !== "index" && t !== "log").map(t => ({t, text: norm(label(t) + "\n" + plain(PAGES[t].body)), raw: plain(PAGES[t].body)}));
  IDX = {docs, N: docs.length, maxIdf: Math.log((docs.length + 1) / 0.5)};
}
const idfOf = k => { const df = IDX.docs.filter(d => d.text.includes(k)).length; return df ? Math.log((IDX.N + 1) / (df + 0.5)) : 0; };
function units(q){
  // 把問題切成「字」單位：中文逐字、英數整段；每個字附上可能的雙字詞
  for (const [re, to] of SYN) q = q.replace(re, to);
  const out = [];
  for (const run of (q.toLowerCase().match(/[\u3400-\u9fff]+|[a-z0-9]+/g) || [])){
    if (/^[a-z0-9]+$/.test(run)){ out.push({ch: run, keys: [run], stop: false}); continue; }
    [...run].forEach((c, i, arr) => out.push({ch: c, stop: STOPCH.has(c), keys: [i > 0 ? arr[i-1] + c : null, i < arr.length - 1 ? c + arr[i+1] : null].filter(Boolean)}));
  }
  return out;
}
function search(q){
  if (!IDX) buildIndex();
  const us = units(q).filter(u => !u.stop);
  if (!us.length) return {hits: []};
  const idf = {}; us.forEach(u => u.keys.forEach(k => { if (!(k in idf)) idf[k] = idfOf(k); }));
  // 每個字的權重：能在 wiki 找到的詞用它的稀有度；連續兩字以上都找不到（像「宿舍」）給最高權重，代表 wiki 沒有這個主題
  us.forEach(u => { u.known = u.keys.filter(k => idf[k] > 0); u.w = u.known.length ? Math.max(...u.known.map(k => idf[k])) : 1; });
  us.forEach((u, i) => { if (!u.known.length && ((us[i-1] && !us[i-1].known.length) || (us[i+1] && !us[i+1].known.length))) u.w = IDX.maxIdf; });
  const total = us.reduce((a, u) => a + u.w, 0);
  const hits = [];
  for (const d of IDX.docs){
    let got = 0; const found = new Set();
    for (const u of us){ const k = u.known.filter(k => d.text.includes(k)); if (k.length){ got += u.w; k.forEach(x => found.add(x)); } }
    if (!found.size) continue;
    let sc = got / total;
    if ([...found].some(k => label(d.t).toLowerCase().includes(k))) sc += 0.08;
    if (PAGES[d.t].type === "source") sc -= 0.05;
    hits.push({...d, sc, found: [...found]});
  }
  hits.sort((a, b) => b.sc - a.sc);
  const best = hits.length ? hits[0].sc : 0;
  return {hits: best < 0.55 ? [] : hits.filter(h => h.sc >= Math.max(0.4, best * 0.7)).slice(0, 6)};
}
function snippet(h){
  const parts = h.raw.split(/(?<=[。；！？])|\n+/).map(x => x.trim()).filter(x => x.length > 3);
  let best = parts[0] || "", bs = -1;
  for (const p of parts){ const lp = p.toLowerCase(); const v = h.found.filter(k => lp.includes(k)).length; if (v > bs){ bs = v; best = p; } }
  if (best.length > 110) best = best.slice(0, 110) + "…";
  const re = new RegExp(h.found.slice().sort((a,b)=>b.length-a.length).map(k => k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|"), "gi");
  return esc(best).replace(re, m => `<mark>${m}</mark>`);
}

// ---------- 提問 ----------
function resultsHtml(hits, title){
  if (!hits.length) return "";
  return `<section class="results"><h2>${title}</h2><ul>${hits.slice(0,6).map(x => `<li>${link(x.t)}<p>${snippet(x)}</p><small>最後修訂於 ${esc(PAGES[x.t].updated || "")}</small></li>`).join("")}</ul></section>`;
}
function answerBox(kind, labelText, text, extra){
  return `<section class="answer ${kind}" id="ai" aria-live="polite"><p class="label">${labelText}</p><p class="text">${text}</p>${extra||""}</section>`;
}
function showSearch(q){
  layout("plain");
  const {hits} = search(q);
  const seq = ++askSeq;
  let h = `<h1 class="ptitle">提問結果</h1>` + tabs("提問", null) + `<p class="ask-line">你問：<b>${esc(q)}</b></p>`;
  if (ASK_API){
    h += `<section class="answer" id="ai" aria-live="polite"><p class="wait">正在讀原寶的條目、整理回答…</p></section><div id="rel">${resultsHtml(hits, "相關條目")}</div>`;
  } else {
    h += hits.length ? resultsHtml(hits, "相關條目") : answerBox("nodata", "目前沒有資料", `原寶還沒有這方面的內容。可以換個說法再問一次，或直接聯絡${CONTACT}。`, START);
  }
  $("art").innerHTML = h;
  setModified(null);
  document.title = `${q} - 提問結果 - ${SITE}`;
  if (ASK_API) askAI(q, seq, hits);
}
async function askAI(q, seq, hits){
  const box = $("ai"), rel = $("rel");
  const current = () => seq === askSeq && document.body.contains(box);
  try {
    const r = await fetch(ASK_API, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({question: q})});
    const d = await r.json().catch(() => ({}));
    if (!current()) return;
    if (d.error === "question_too_long") throw new Error("問題太長了，請精簡到 200 字以內。");
    if (!r.ok || d.error) throw new Error("");
    const status = d.status || (d.found ? "answered" : "no_data");
    if (status === "off_topic"){
      box.outerHTML = answerBox("offtopic", "不在服務範圍", esc(d.answer || ""));
      rel.innerHTML = "";
      return;
    }
    const srcs = (d.sources || []).filter(t => PAGES[t]);
    const text = esc(d.answer || "").replace(/\n/g,"<br>");
    if (status === "answered"){
      box.outerHTML = answerBox("", "回答", text, (srcs.length ? `<p class="src">依據：${srcs.map(x => link(x)).join("、")}</p>` : "") + `<p class="note">由 AI 根據原寶的條目整理，可能有誤，請以原資中心與原民會正式公告為準。</p>`);
    } else {
      box.outerHTML = answerBox("nodata", "目前沒有資料", text);
      if (!hits.length) rel.innerHTML = START;
    }
  } catch (e) {
    if (!current()) return;
    const msg = e.message || "AI 回答暫時無法使用。";
    box.outerHTML = hits.length
      ? answerBox("offtopic", "AI 暫時無法回答", esc(msg) + " 可以先看下方的相關條目。")
      : answerBox("nodata", "目前沒有資料", `${esc(msg)} 也可以直接聯絡${CONTACT}。`, START);
  }
}

(function(){
  const root = document.documentElement;
  const DEF = {font:"standard", width:"standard", theme:"auto", pinned:true};
  let a = {};
  try { a = JSON.parse(localStorage.getItem("appearance") || "{}"); } catch (e) {}
  const get = k => (k in a ? a[k] : DEF[k]);
  const save = () => { try { localStorage.setItem("appearance", JSON.stringify(a)); } catch (e) {} };
  const form = $("appearTpl").content.firstElementChild.cloneNode(true);
  const wideScreen = matchMedia("(min-width: 1180px)");
  function applyLook(){
    for (const k of ["font","width","theme"]){
      const v = get(k);
      if (v === DEF[k]) delete root.dataset[k]; else root.dataset[k] = v;
      const r = form.querySelector(`input[name="${k}"][value="${v}"]`); if (r) r.checked = true;
    }
  }
  function place(){
    const pinned = get("pinned") && wideScreen.matches;
    document.body.classList.toggle("has-tools", pinned);
    $("appearBtn").hidden = pinned;
    const pin = form.querySelector("#pinBtn");
    pin.textContent = pinned ? "隱藏" : "固定在側欄";
    pin.hidden = !wideScreen.matches;
    (pinned ? $("tools") : $("appearDrop")).appendChild(form);
  }
  form.addEventListener("change", e => { a[e.target.name] = e.target.value; save(); applyLook(); });
  form.addEventListener("submit", e => e.preventDefault());
  form.querySelector("#pinBtn").addEventListener("click", e => { e.stopPropagation(); a.pinned = !(get("pinned") && wideScreen.matches); save(); closeMenus(); place(); });
  wideScreen.addEventListener("change", place);
  applyLook(); place();
})();
