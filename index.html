<script>
  // 先套用使用者在「外觀」選過的設定，避免載入時閃一下
  try {
    const a = JSON.parse(localStorage.getItem("appearance") || "{}"), r = document.documentElement;
    if (a.font && a.font !== "standard") r.dataset.font = a.font;
    if (a.width && a.width !== "standard") r.dataset.width = a.width;

<style>
:root{
  --bg:#ffffff; --ink:#000000; --muted:#555555; --line:#d4d4d4; --soft:#f3f3f3;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --col:720px; --wide:1120px; --scale:1;
  color-scheme:light;
  box-sizing:border-box;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --bg:#000000; --ink:#ffffff; --muted:#a8a8a8; --line:#3a3a3a; --soft:#141414; color-scheme:dark; }
}
:root[data-font="small"]{--scale:.9}
:root[data-font="large"]{--scale:1.15}
:root[data-width="wide"]{--col:960px;--wide:1400px}
:root[data-theme="dark"]{ --bg:#000000; --ink:#ffffff; --muted:#a8a8a8; --line:#3a3a3a; --soft:#141414; color-scheme:dark; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:calc(17px * var(--scale));line-height:1.85}
a{color:var(--ink);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
a:hover{text-decoration-thickness:2px}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:2px}
button,input{font:inherit;color:inherit}

/* 頂部橫條 */
header.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-inner{max-width:var(--wide);margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:20px}
.brand{font-family:var(--serif);font-weight:900;font-size:calc(17px * var(--scale));text-decoration:none;white-space:nowrap}
.top-search{flex:1;display:flex;justify-content:center}
.top-search form{width:100%;max-width:420px;display:flex}
.top-search input{width:100%;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:calc(15px * var(--scale))}
.top-search input:focus{border-color:var(--ink);outline:none}
.appear{position:relative;margin-left:auto}
.appear-btn{background:none;border:1px solid var(--line);border-radius:8px;padding:4px 12px;font-size:calc(14px * var(--scale));cursor:pointer;white-space:nowrap}
.appear-btn:hover,.appear-btn[aria-expanded="true"]{border-color:var(--ink)}
.appear-panel{position:absolute;right:0;top:calc(100% + 8px);width:230px;background:var(--bg);border:1px solid var(--ink);border-radius:10px;padding:6px 18px 12px;z-index:40;line-height:1.5}
.appear-panel[hidden]{display:none}
.appear-panel fieldset{border:0;margin:0;padding:10px 0;border-bottom:1px solid var(--line)}
.appear-panel fieldset:last-child{border-bottom:0}
.appear-panel legend{font-weight:700;font-size:calc(14px * var(--scale));padding:0;margin-bottom:4px;float:left;width:100%}
.appear-panel label{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:calc(15px * var(--scale));cursor:pointer;clear:both}
.appear-panel input{accent-color:var(--ink);width:16px;height:16px;margin:0}
body.home .top-search{visibility:hidden}

main{max-width:var(--col);margin:0 auto;padding:40px 24px 80px}

/* 首頁 */
body.home main{max-width:var(--wide)}
.portal{border:1px solid var(--ink);border-radius:12px;padding:32px 36px 28px;margin:0 0 28px}
.portal-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin:0 0 24px}
.portal h1{font-family:var(--serif);font-weight:900;font-size:calc(clamp(30px,5vw,44px) * var(--scale));line-height:1.2;margin:0 0 6px;letter-spacing:.02em}
.portal .sub{color:var(--muted);margin:0;font-size:calc(16px * var(--scale))}
.stats{text-align:right;font-size:calc(15px * var(--scale));line-height:1.9}

.ask{display:flex;gap:10px}

article pre{background:var(--soft);padding:14px;border-radius:8px;overflow-x:auto;font-size:calc(14px * var(--scale));line-height:1.6}
article pre code{background:none;padding:0}
article img{max-width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:6px;margin:16px 0}
.tablewrap{overflow-x:auto;margin:16px 0}
table{border-collapse:collapse;width:100%;font-size:calc(15.5px * var(--scale));line-height:1.6}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}

.meta{margin-top:56px;padding-top:16px;border-top:1px solid var(--line);font-size:calc(15px * var(--scale));color:var(--muted);line-height:1.8}
.meta p{margin:0 0 6px}
.meta a{color:var(--ink)}

/* 提問結果 */
.q-title{font-family:var(--serif);font-weight:900;font-size:calc(clamp(24px,4.5vw,32px) * var(--scale));line-height:1.35;margin:0 0 24px}
.answer{border:2px solid var(--ink);border-radius:10px;padding:18px 20px;margin:0 0 32px}
.answer.nodata{border-style:dashed}
.answer.offtopic{border:1px solid var(--line)}
.answer .label{font-size:calc(14px * var(--scale));font-weight:700;margin:0 0 6px}
.answer .text{margin:0;font-size:calc(17.5px * var(--scale))}
.answer.offtopic .text{color:var(--muted)}
.answer .src{margin:12px 0 0;font-size:calc(15px * var(--scale))}
.answer .note{margin:10px 0 0;font-size:calc(13px * var(--scale));color:var(--muted)}
.answer .wait{margin:0;color:var(--muted)}
.related h2{font-size:calc(15px * var(--scale));font-weight:700;margin:0 0 8px;font-family:var(--sans)}
.related ul{list-style:none;padding:0;margin:0}
.related li{padding:8px 0;border-bottom:1px solid var(--line)}
.related li p{margin:2px 0 0;font-size:calc(15px * var(--scale));color:var(--muted);line-height:1.7}
.related mark{background:none;color:var(--ink);font-weight:700}

footer{max-width:var(--col);margin:0 auto;padding:0 24px 48px;font-size:calc(13.5px * var(--scale));color:var(--muted);line-height:1.8}
footer .in{border-top:1px solid var(--line);padding-top:20px}
footer nav{margin-bottom:6px}
footer a{color:var(--muted)}

@media (max-width:860px){ .home-grid{grid-template-columns:minmax(0,1fr)} }
@media (max-width:640px){
  .top-inner{flex-wrap:wrap;gap:8px 12px;padding:10px 16px}
  .top-search{order:3;flex-basis:100%}
  .top-search form{max-width:none}
  body.home .top-search{display:none}
  main{padding:20px 14px 64px}
  footer{padding:0 14px 40px}
  .portal{padding:22px 18px 20px}
  .portal-head{margin-bottom:18px}
  .stats{text-align:left}
  .stats nav a{margin:0 14px 0 0}
  .ask input{height:56px;font-size:calc(17px * var(--scale));padding:0 14px}
  .ask button{padding:0 18px;font-size:calc(16px * var(--scale))}

  body{font-size:calc(16.5px * var(--scale))}
}
</style>

<body>
<header class="top">
  <div class="top-inner">
    <a class="brand" href="#/">原民會獎助學金 Wiki</a>
    <div class="top-search"><form id="topform" role="search" autocomplete="off"><input id="topq" type="search" placeholder="問獎助學金或校園生活的問題" aria-label="提問" autocomplete="off" spellcheck="false"></form></div>
    <div class="appear">
      <button class="appear-btn" id="appearBtn" type="button" aria-expanded="false" aria-controls="appearPanel">外觀</button>
      <form class="appear-panel" id="appearPanel" hidden>
        <fieldset><legend>文字</legend>
          <label><input type="radio" name="font" value="small">小</label>
          <label><input type="radio" name="font" value="standard">標準</label>
          <label><input type="radio" name="font" value="large">大</label>
        </fieldset>
        <fieldset><legend>寬度</legend>
          <label><input type="radio" name="width" value="standard">標準</label>
          <label><input type="radio" name="width" value="wide">寬</label>
        </fieldset>
        <fieldset><legend>顏色</legend>
          <label><input type="radio" name="theme" value="auto">自動（跟著系統）</label>
          <label><input type="radio" name="theme" value="light">淺色</label>
          <label><input type="radio" name="theme" value="dark">深色</label>
        </fieldset>
      </form>
    </div>
  </div>
</header>
<main><article id="art"></article></main>
<footer><div class="in">
  <nav><a href="#/index">全部條目</a>　<a href="#/log">操作紀錄</a></nav>
  本站依 Karpathy 的 LLM Wiki 模式整理：原始資料保存在 raw/，條目由 LLM 依 AGENTS.md 規則撰寫與交叉連結。內容僅供參考，請以原資中心與原民會正式公告為準。
</div></footer>
<script src="assets/marked.min.js"></script>
<script>
// ===== 設定 =====
// AI 問答的網址。部署在 Vercel 時維持 "/api/ask" 即可。改成 "" = 關閉 AI，只用關鍵字搜尋
const ASK_API = "/api/ask";
// 首頁的範例問題
const EXAMPLES = ["成績 65 分可以申請嗎", "要交哪些文件", "什麼時候截止"];
// 首頁的截止提醒
const DEADLINES = {online:new Date("2026-10-14T23:59:00+08:00"), paper:new Date("2026-10-15T17:00:00+08:00")};
// ================

const PAGES = {};
let order = [];
const backlinks = {};
const HOME = "總覽";
const TYPES = {concept:"主題", entity:"單位", query:"問答與檢查", source:"來源", meta:"紀錄"};
const LABEL = {index:"全部條目", log:"操作紀錄"};
const label = t => LABEL[t] || t;

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
const link = t => `<a href="#/${encodeURIComponent(t)}">${esc(label(t).replace(/^來源-/,"來源："))}</a>`;
function wikify(md){ return md.replace(/\[\[(.+?)\]\]/g,(m,t)=> PAGES[t] ? link(t) : esc(t)); }
function render(md){
  const src = wikify(md);
  const html = window.marked ? marked.parse(src,{gfm:true,breaks:false,mangle:false,headerIds:false}) : "<pre>"+src+"</pre>";
  return html.replace(/<table>/g,'<div class="tablewrap"><table>').replace(/<\/table>/g,'</table></div>');
}

function parsePage(txt){
  const m = txt.replace(/\r\n/g,"\n").match(/^---\n([\s\S]*?)\n---\n([\s\S]*)$/);
  if (!m) return null;
  const fm = {};
  for (const line of m[1].split("\n")){
    const i = line.indexOf(":"); if (i<0) continue;
    const k = line.slice(0,i).trim(), v = line.slice(i+1).trim();
    fm[k] = v.startsWith("[") ? v.slice(1,-1).split(",").map(x=>x.trim()).filter(Boolean) : v;
  }
  return {title:fm.title, type:fm.type||"concept", sources:fm.sources||[], updated:fm.updated||"", body:m[2]};
}
async function load(){
  const list = await (await fetch("wiki/pages.json",{cache:"no-cache"})).json();
  const texts = await Promise.all(list.map(p => fetch("wiki/"+encodeURI(p),{cache:"no-cache"}).then(r => r.ok ? r.text() : "")));
  texts.forEach(txt => { const p = parsePage(txt); if (p && p.title){ PAGES[p.title] = p; order.push(p.title); } });
  for (const t of order){ for (const m of PAGES[t].body.matchAll(/\[\[(.+?)\]\]/g)){ (backlinks[m[1]] ||= new Set()).add(t); } }
}

// ---------- 搜尋 ----------
const STOPCH = new Set([..."嗎呢吧啊的了是我你妳他她要有在能會可以和與及或問什麼怎如何哪裡多少還都也就嗎那這個些想該"]);
const SYN = [[/研究所|研究生|碩士|博士/g,"碩博士"],[/多少錢|金額多少|領多少|幾塊/g,"金額"],[/期限|最後一天|deadline/gi,"截止"],[/低收入|中低收|低收/g,"低收入戶"],[/影本|copy/gi,"影本"],[/服務時數|時數/g,"時數"],[/達悟/g,"雅美"],[/一起|同時|兩個都|都領|兼領/g,"同時"],[/原資中心|原資/g,"原住民族學生資源中心"]];
let IDX = null;
const plain = md => md.replace(/^---[\s\S]*?---/,"").replace(/\[\[(.+?)\]\]/g,"$1").replace(/!\[[^\]]*\]\([^)]*\)/g,"").replace(/\[([^\]]+)\]\([^)]*\)/g,"$1").replace(/^\s*(?:[-+]|\d+\.)\s+/gm,"").replace(/[#*|`>]/g," ").replace(/-{3,}/g," ");
function buildIndex(){
  const norm = x => SYN.reduce((a, [re, to]) => a.replace(re, to), x).toLowerCase();
  const docs = order.filter(t => t !== "index" && t !== "log").map(t => ({t, text: norm(label(t) + "\n" + plain(PAGES[t].body)), raw: plain(PAGES[t].body)}));
  IDX = {docs, N: docs.length, maxIdf: Math.log((docs.length + 1) / 0.5)};
}
const idfOf = k => { const df = IDX.docs.filter(d => d.text.includes(k)).length; return df ? Math.log((IDX.N + 1) / (df + 0.5)) : 0; };
function units(q){
  // 把問題切成「字」單位：中文逐字、英數整段；每個字附上可能的雙字詞
  for (const [re, to] of SYN) q = q.replace(re, to);
  const out = [];
  for (const run of (q.toLowerCase().match(/[\u3400-\u9fff]+|[a-z0-9]+/g) || [])){
    if (/^[a-z0-9]+$/.test(run)){ out.push({ch: run, keys: [run], stop: false}); continue; }
    [...run].forEach((c, i, arr) => out.push({ch: c, stop: STOPCH.has(c), keys: [i > 0 ? arr[i-1] + c : null, i < arr.length - 1 ? c + arr[i+1] : null].filter(Boolean)}));
  }
  return out;
}
function search(q){
  if (!IDX) buildIndex();
  const us = units(q).filter(u => !u.stop);
  if (!us.length) return {hits: []};
  const idf = {}; us.forEach(u => u.keys.forEach(k => { if (!(k in idf)) idf[k] = idfOf(k); }));
  // 每個字的權重：能在 wiki 找到的詞用它的稀有度；連續兩字以上都找不到（像「宿舍」）給最高權重，代表 wiki 沒有這個主題
  us.forEach(u => { u.known = u.keys.filter(k => idf[k] > 0); u.w = u.known.length ? Math.max(...u.known.map(k => idf[k])) : 1; });
  us.forEach((u, i) => { if (!u.known.length && ((us[i-1] && !us[i-1].known.length) || (us[i+1] && !us[i+1].known.length))) u.w = IDX.maxIdf; });
  const total = us.reduce((a, u) => a + u.w, 0);
  const hits = [];
  for (const d of IDX.docs){
    let got = 0; const found = new Set();
    for (const u of us){ const k = u.known.filter(k => d.text.includes(k)); if (k.length){ got += u.w; k.forEach(x => found.add(x)); } }
    if (!found.size) continue;
    let sc = got / total;
    if ([...found].some(k => label(d.t).toLowerCase().includes(k))) sc += 0.08;
    if (PAGES[d.t].type === "source") sc -= 0.05;
    hits.push({...d, sc, found: [...found]});
  }
  hits.sort((a, b) => b.sc - a.sc);
  const best = hits.length ? hits[0].sc : 0;
  return {hits: best < 0.55 ? [] : hits.filter(h => h.sc >= Math.max(0.4, best * 0.7)).slice(0, 6)};
}
function snippet(h){
  const parts = h.raw.split(/(?<=[。；！？])|\n+/).map(x => x.trim()).filter(x => x.length > 3);
  let best = parts[0] || "", bs = -1;
  for (const p of parts){ const lp = p.toLowerCase(); const v = h.found.filter(k => lp.includes(k)).length; if (v > bs){ bs = v; best = p; } }
  if (best.length > 110) best = best.slice(0, 110) + "…";
  const re = new RegExp(h.found.slice().sort((a,b)=>b.length-a.length).map(k => k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|"), "gi");
  return esc(best).replace(re, m => `<mark>${m}</mark>`);
}

function statusBlock(){
  const now = new Date(), fmt = d => d.toLocaleString("zh-TW",{timeZone:"Asia/Taipei",month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit",hour12:false});
  const left = d => { const ms=d-now, h=Math.floor(ms/3600000), m=Math.floor(ms%3600000/60000); return h>=24?`還有 ${Math.floor(h/24)} 天 ${h%24} 小時`:`還有 ${h} 小時 ${m} 分`; };
  if (now < DEADLINES.online) return `<div class="status"><b>開放申請中</b><span>線上申請截止 ${fmt(DEADLINES.online)}（${left(DEADLINES.online)}），紙本收件截止 ${fmt(DEADLINES.paper)}。</span></div>`;
  if (now < DEADLINES.paper) return `<div class="status"><b>紙本今天 17:00 前要交</b><span>線上申請已截止。紙本收件截止 ${fmt(DEADLINES.paper)}（${left(DEADLINES.paper)}），交到行政大樓三樓原資中心。</span></div>`;
  return `<div class="status"><b>本學期申請已截止</b><span>紙本收件已於 ${fmt(DEADLINES.paper)} 截止，下學期期程請留意原資中心公告。</span></div>`;
}

// ---------- 畫面 ----------
const art = () => document.getElementById("art");
const go = q => { location.hash = "#search=" + encodeURIComponent(q); };
const START = `<p>可以先看看<a href="#/">首頁的重點一覽</a>，或<a href="#/${encodeURIComponent("我適合申請哪一種")}">我適合申請哪一種</a>。</p>`;
const CONTACT = "原資中心：電話 (02) 2939-3091 分機 67030、信箱 isrc@nccu.edu.tw";
let askSeq = 0;

const LOGTYPE = {ingest:"新增資料", query:"新增問答", lint:"健檢", feature:"新功能", publish:"發佈", fix:"修正", design:"改版"};
function sections(md){
  const out = {}; let cur = "_intro";
  for (const line of md.replace(/^#\s.*\n/, "").split("\n")){
    const m = line.match(/^##\s+(.+)$/);
    if (m){ cur = m[1].trim(); out[cur] = ""; } else out[cur] = (out[cur] || "") + line + "\n";
  }
  return out;
}
function box(title, inner){ return inner ? `<section class="box"><h2>${title}</h2>${inner}</section>` : ""; }
function recentUpdates(n){
  if (!PAGES.log) return "";
  const items = [...PAGES.log.body.matchAll(/^##\s*\[(\d{4}-\d{2}-\d{2})\]\s*(\w+)\s*[｜|]\s*(.+)$/gm)].reverse().slice(0, n);
  if (!items.length) return "";
  return `<ul class="updates">${items.map(m => `<li><span class="k">${esc(LOGTYPE[m[2]] || m[2])}</span><span>${esc(m[3])}</span></li>`).join("")}</ul><p class="more"><a href="#/log">完整操作紀錄</a></p>`;
}
function showHome(){
  document.body.classList.add("home");
  const sec = PAGES[HOME] ? sections(PAGES[HOME].body) : {};
  const count = order.filter(t => t !== "index" && t !== "log").length;
  const left = box("重點一覽", render((sec._intro || "") + (sec["重點一覽"] || ""))) + box("從哪裡開始", sec["從哪裡開始"] ? render(sec["從哪裡開始"]) : "");
  const right = box("截止提醒", statusBlock()) + box("最近更新", recentUpdates(5)) + box("原始文件", sec["原始文件"] ? render(sec["原始文件"]) : "");
  art().innerHTML = `<section class="portal">
      <div class="portal-head">
        <div><h1>原民會大專獎助學金</h1><p class="sub">政大 115 學年度第 1 學期，有問題直接問</p></div>
        <div class="stats">已有 <b>${count}</b> 篇條目<nav><a href="#/index">全部條目</a><a href="#/${encodeURIComponent("待確認事項")}">待確認事項</a><a href="#/log">操作紀錄</a></nav></div>
      </div>
      <form class="ask" id="homeform" role="search" autocomplete="off"><input id="homeq" type="search" placeholder="輸入你的問題" aria-label="提問" autocomplete="off" spellcheck="false"><button type="submit">提問</button></form>
      <div class="examples"><span>試試看：</span>${EXAMPLES.map(x => `<button type="button" data-q="${esc(x)}">${esc(x)}</button>`).join("")}</div>
    </section>
    <div class="home-grid"><div class="col">${left}</div><div class="col">${right}</div></div>`;
  document.title = "原民會大專獎助學金 LLM Wiki｜政大";
}

function showPage(t){
  const p = PAGES[t];
  let meta = "";
  if (p.sources && p.sources.length) meta += `<p>依據來源：${p.sources.map(link).join("、")}</p>`;
  const bl = [...(backlinks[t]||[])].filter(x => x !== t && x !== "index" && x !== "log");
  if (bl.length) meta += `<p>連到這裡的條目：${bl.map(link).join("、")}</p>`;
  if (p.updated) meta += `<p>最後更新：${esc(p.updated)}</p>`;
  art().innerHTML = (TYPES[p.type] ? `<p class="crumb">${TYPES[p.type]}</p>` : "") + render(p.body) + (meta ? `<div class="meta">${meta}</div>` : "");
  document.title = `${label(t)}｜原民會獎助學金 LLM Wiki`;
}

function relatedHtml(hits, withSnippet){
  if (!hits.length) return "";
  return `<section class="related"><h2>相關條目</h2><ul>${hits.slice(0,5).map(x => `<li>${link(x.t)}${withSnippet ? `<p>${snippet(x)}</p>` : ""}</li>`).join("")}</ul></section>`;
}
function answerBox(kind, labelText, text, extra){
  return `<section class="answer ${kind}" id="ai" aria-live="polite"><p class="label">${labelText}</p><p class="text">${text}</p>${extra||""}</section>`;
}

function showSearch(q){
  const {hits} = search(q);
  const seq = ++askSeq;
  let h = `<p class="crumb">提問</p><h1 class="q-title">${esc(q)}</h1>`;
  if (ASK_API){
    h += `<section class="answer" id="ai" aria-live="polite"><p class="wait">正在讀 wiki、整理回答…</p></section><div id="rel">${relatedHtml(hits, false)}</div>`;
  } else {
    h += hits.length ? relatedHtml(hits, true) : answerBox("nodata", "目前沒有資料", `這個 wiki 還沒有這方面的內容。可以換個說法再問一次，或直接聯絡${CONTACT}。`, START);
  }
  art().innerHTML = h;
  document.title = `${q}｜原民會獎助學金 LLM Wiki`;
  if (ASK_API) askAI(q, seq, hits);
}

async function askAI(q, seq, hits){
  const box = document.getElementById("ai"), rel = document.getElementById("rel");
  const current = () => seq === askSeq && document.body.contains(box);
  try {
    const r = await fetch(ASK_API, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({question: q})});
    const d = await r.json().catch(() => ({}));
    if (!current()) return;
    if (d.error === "question_too_long") throw new Error("問題太長了，請精簡到 200 字以內。");
    if (!r.ok || d.error) throw new Error("");
    const status = d.status || (d.found ? "answered" : "no_data");
    const note = `<p class="note">由 AI 根據本 wiki 整理，可能有誤，請以原資中心與原民會正式公告為準。</p>`;
    if (status === "off_topic"){
      box.outerHTML = answerBox("offtopic", "不在服務範圍", esc(d.answer || ""));
      rel.innerHTML = "";
      return;
    }
    const srcs = (d.sources || []).filter(t => PAGES[t]);
    const text = esc(d.answer || "").replace(/\n/g,"<br>");
    if (status === "answered"){
      box.outerHTML = answerBox("", "回答", text, (srcs.length ? `<p class="src">依據：${srcs.map(link).join("、")}</p>` : "") + note);
      if (srcs.length) rel.innerHTML = relatedHtml(hits.filter(h => !srcs.includes(h.t)), false);
    } else {
      box.outerHTML = answerBox("nodata", "目前沒有資料", text);
      if (!hits.length) rel.innerHTML = START;
    }
  } catch (e) {
    if (!current()) return;
    const msg = e.message || "AI 回答暫時無法使用。";
    box.outerHTML = hits.length
      ? answerBox("offtopic", "AI 暫時無法回答", esc(msg) + " 可以先看下方的相關條目。")
      : answerBox("nodata", "目前沒有資料", `${esc(msg)} 也可以直接聯絡${CONTACT}。`, START);
  }
}

function show(){
  document.body.classList.remove("home");
  const sm = location.hash.match(/^#search=(.*)$/);
  if (sm){
    const q = decodeURIComponent(sm[1]);
    document.getElementById("topq").value = q;
    showSearch(q);
  } else {
    document.getElementById("topq").value = "";
    const t = decodeURIComponent(location.hash.replace(/^#\/?/,""));
    if (!t || t === HOME || !PAGES[t]) showHome(); else showPage(t);
  }
  window.scrollTo(0,0);
}

document.addEventListener("submit", e => {
  const id = e.target.id; if (id !== "topform" && id !== "homeform") return;
  e.preventDefault();
  const v = document.getElementById(id === "topform" ? "topq" : "homeq").value.trim();
  if (v) go(v);
});
document.addEventListener("click", e => {
  const b = e.target.closest(".examples button"); if (b) go(b.dataset.q);
});

// 外觀：文字大小、寬度、顏色，選擇會記在瀏覽器
(function(){
  const root = document.documentElement, btn = document.getElementById("appearBtn"), panel = document.getElementById("appearPanel");
  const KEYS = {font:"standard", width:"standard", theme:"auto"};
  let a = {};
  try { a = JSON.parse(localStorage.getItem("appearance") || "{}"); } catch (e) {}
  const cur = k => a[k] || KEYS[k];
  const apply = () => {
    for (const k of Object.keys(KEYS)){
      const v = cur(k);
      if (v === KEYS[k]) delete root.dataset[k]; else root.dataset[k] = v;
      const r = panel.querySelector(`input[name="${k}"][value="${v}"]`); if (r) r.checked = true;
    }
  };
  panel.addEventListener("change", e => {
    a[e.target.name] = e.target.value;
    try { localStorage.setItem("appearance", JSON.stringify(a)); } catch (err) {}
    apply();
  });
  panel.addEventListener("submit", e => e.preventDefault());
  const open = v => { panel.hidden = !v; btn.setAttribute("aria-expanded", String(v)); };
  btn.addEventListener("click", () => open(panel.hidden));
  document.addEventListener("click", e => { if (!panel.hidden && !e.target.closest(".appear")) open(false); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !panel.hidden){ open(false); btn.focus(); } });
  apply();
})();

window.addEventListener("hashchange", show);
load().then(show).catch(() => {
  art().innerHTML = `<h1>讀不到 wiki 內容</h1><p>這個網頁要透過網站伺服器開啟，直接雙擊 index.html 會讀不到 Markdown 檔。部署到網路上，或在資料夾裡執行 <code>python -m http.server</code> 再開 http://localhost:8000 即可。</p>`;
});
</script>
