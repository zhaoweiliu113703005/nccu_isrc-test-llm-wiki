<style>
:root{
  --paper:#F5F7F3; --panel:#E9EEE7; --ink:#20302B; --muted:#5A6A64; --line:#CCD6CE;
  --sage:#4E7560; --sage-soft:#DCE7DE; --mark:#F6E66A; --mark-ink:#20302B; --warn:#9B3B26; --warn-soft:#F7E3DC;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#151B19; --panel:#1C2421; --ink:#E4EAE5; --muted:#9AA8A1; --line:#2F3B37;
    --sage:#8DB79C; --sage-soft:#22332B; --mark:rgba(240,220,90,.32); --mark-ink:#F4F1D0; --warn:#E89A84; --warn-soft:#3A2420;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#151B19; --panel:#1C2421; --ink:#E4EAE5; --muted:#9AA8A1; --line:#2F3B37;
  --sage:#8DB79C; --sage-soft:#22332B; --mark:rgba(240,220,90,.32); --mark-ink:#F4F1D0; --warn:#E89A84; --warn-soft:#3A2420;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.85}
a{color:var(--sage)}
:focus-visible{outline:3px solid var(--sage);outline-offset:2px;border-radius:3px}

.shell{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}
aside.nav{background:var(--panel);border-right:1px solid var(--line);padding:28px 20px 40px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{font-family:var(--serif);font-weight:900;font-size:21px;line-height:1.35;margin:0 0 4px;color:var(--ink);text-decoration:none;display:block}
.brand-sub{font-size:13px;color:var(--muted);margin:0 0 20px}
.search{width:100%;font:inherit;font-size:15px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
.navgroup{margin-top:22px}
.navgroup h2{font-size:13px;font-weight:500;color:var(--muted);margin:0 0 6px;letter-spacing:.05em}
.navgroup ul{list-style:none;margin:0;padding:0}
.navgroup a{display:block;padding:5px 10px;margin:0 -10px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:15px;line-height:1.5}
.navgroup a:hover{background:var(--sage-soft)}
.navgroup a[aria-current="page"]{background:var(--sage);color:var(--paper);font-weight:500}
.results li a small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
[aria-current="page"] small{color:inherit!important;opacity:.85}

.topbar{display:none}
main{padding:48px 56px 80px;max-width:1180px}
.cols{display:grid;grid-template-columns:minmax(0,72ch) 220px;gap:56px;align-items:start}
.crumb{font-size:13px;color:var(--muted);margin-bottom:6px}
article h1{font-family:var(--serif);font-weight:900;font-size:clamp(28px,4vw,40px);line-height:1.3;margin:0 0 24px;letter-spacing:.01em}
article h2{font-family:var(--serif);font-weight:600;font-size:23px;line-height:1.4;margin:40px 0 12px;padding-top:4px;border-top:1px solid var(--line)}
article h2:first-of-type{border-top:0}
article p,article li{max-width:72ch}
article ul,article ol{padding-left:1.4em}
article li{margin:4px 0}
article strong{font-weight:700;color:var(--mark-ink);background:linear-gradient(transparent 38%,var(--mark) 38%,var(--mark) 92%,transparent 92%);padding:0 .12em}
article code{font-size:.88em;background:var(--sage-soft);padding:1px 6px;border-radius:4px;word-break:break-all}
article pre{background:var(--panel);padding:14px;border-radius:8px;overflow-x:auto;font-size:14px;line-height:1.6}
article pre code{background:none;padding:0}
a.wl{color:var(--sage);text-decoration:none;border-bottom:1.5px solid color-mix(in srgb,var(--sage) 45%,transparent);font-weight:500}
a.wl:hover{border-bottom-color:var(--sage)}
.tablewrap{overflow-x:auto;margin:16px 0}
table{border-collapse:collapse;width:100%;font-size:15.5px;line-height:1.6}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:700;background:var(--panel)}
article img,img.src{max-width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:6px;margin:12px 0 4px}
figure{margin:24px 0}

.status{border-left:4px solid var(--sage);background:var(--sage-soft);padding:14px 18px;border-radius:0 8px 8px 0;margin:0 0 28px;line-height:1.6}

.side{position:sticky;top:48px;font-size:14px;line-height:1.6}
.side h3{font-size:13px;font-weight:500;color:var(--muted);margin:0 0 8px;letter-spacing:.05em}
.side ul{list-style:none;margin:0 0 28px;padding:0}
.side li{margin:0 0 6px}
.side .meta{color:var(--muted)}
footer{margin-top:64px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);max-width:72ch}
.themebtn{margin-top:28px;font:inherit;font-size:13px;background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:5px 10px;cursor:pointer}

.askbox{display:flex;gap:8px;margin:0 0 28px}
.askbox input{flex:1;min-width:0;font:inherit;font-size:17px;padding:12px 14px;border:1.5px solid var(--sage);border-radius:10px;background:var(--paper);color:var(--ink)}
.askbox button{font:inherit;font-size:16px;font-weight:500;padding:0 18px;border:0;border-radius:10px;background:var(--sage);color:var(--paper);cursor:pointer}
.hits{list-style:none;padding:0;margin:0}
.hits li{padding:16px 0;border-bottom:1px solid var(--line)}
.hits a.t{font-family:var(--serif);font-weight:600;font-size:19px;color:var(--sage);text-decoration:none}
.hits a.t:hover{text-decoration:underline}
.hits p{margin:4px 0 0;color:var(--muted);font-size:15.5px;line-height:1.7}
mark{background:var(--mark);color:var(--mark-ink);padding:0 .1em;border-radius:2px}
.nodata{border-left:4px solid var(--warn);background:var(--warn-soft);padding:16px 20px;border-radius:0 8px 8px 0;line-height:1.75}
.nodata b{display:block;font-size:18px;margin-bottom:4px}
.ai{border:1.5px solid var(--sage);border-radius:10px;padding:18px 20px;margin:0 0 32px;background:var(--panel)}
.ai h2{font-family:var(--sans);font-size:14px;font-weight:500;color:var(--muted);margin:0 0 8px;border:0;padding:0;letter-spacing:.05em}
.ai .ans{font-size:17.5px;line-height:1.85;margin:0}
.ai .src{margin:12px 0 0;font-size:14.5px;color:var(--muted)}
.ai .note{margin:10px 0 0;font-size:13px;color:var(--muted)}
.ai.nodata-ai{border-color:var(--warn);background:var(--warn-soft)}
.ai.offtopic{border-color:var(--line);background:var(--panel)}
.ai .wait{color:var(--muted);margin:0}
.subhead{font-family:var(--serif);font-weight:600;font-size:20px;margin:8px 0 4px}
@media (max-width:980px){ .cols{grid-template-columns:minmax(0,1fr)} .side{position:static;border-top:1px solid var(--line);padding-top:20px;margin-top:8px} }
@media (max-width:760px){
  .shell{grid-template-columns:1fr}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
  .topbar .brand{font-size:17px;margin:0}
  .menubtn{font:inherit;font-size:15px;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 12px}
  aside.nav{display:none;position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  aside.nav.open{display:block}
  aside.nav > .brand,aside.nav > .brand-sub{display:none}
  main{padding:28px 18px 64px}
  body{font-size:16.5px}
}
@media (prefers-reduced-motion:no-preference){ .navgroup a{transition:background .12s} }

<body>
<div class="topbar"><a class="brand" href="#/總覽">原民會獎助學金 Wiki</a><button class="menubtn" id="menubtn" aria-expanded="false" aria-controls="nav">目錄</button></div>
<div class="shell">
  <aside class="nav" id="nav">
    <a class="brand" href="#/總覽">原民會大專獎助學金<br>政大 LLM Wiki</a>
    <p class="brand-sub">115 學年度第 1 學期</p>
    <form id="qform" role="search"><input class="search" id="q" type="search" placeholder="搜尋，例如：成績單要正本嗎" aria-label="搜尋 wiki"></form>
    <div id="navlist"></div>
    <button class="themebtn" id="themebtn" type="button">切換深淺色</button>
  </aside>
  <main>
    <div class="cols">
      <article id="art"></article>
      <div class="side" id="side"></div>
    </div>
    <footer>本站依 Karpathy 的 LLM Wiki 模式整理：原始資料保存在 raw/，條目由 LLM 依 AGENTS.md 規則撰寫與交叉連結。最後更新 2026-10-15。內容僅供參考，請以原資中心與原民會正式公告為準。</footer>
  </main>
</div>
<script src="assets/marked.min.js"></script>
<script>
// ===== 設定 =====
// AI 問答的網址。部署在 Vercel 時維持 "/api/ask" 即可。
// 改成 "" = 關閉 AI，只用關鍵字搜尋
const ASK_API = "/api/ask";
// ================
const PAGES = {};
const DEADLINES = {online:new Date("2026-10-14T23:59:00+08:00"), paper:new Date("2026-10-15T17:00:00+08:00")};

const GROUPS = [["concept","主題"],["entity","單位"],["query","問答與檢查"],["source","來源"],["meta","紀錄"]];
const LABEL = {index:"目錄", log:"操作紀錄"};
let order = [];
const label = t => LABEL[t] || t;

function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function wikify(md){
  return md.replace(/\[\[(.+?)\]\]/g,(m,t)=> PAGES[t]
    ? `<a class="wl" href="#/${encodeURIComponent(t)}">${esc(label(t))}</a>` : esc(t));
}
function render(md){
  const src = wikify(md);
  let html;
  if (window.marked){ html = marked.parse(src,{gfm:true,breaks:false,mangle:false,headerIds:false}); }
  else { html = "<pre>"+src+"</pre>"; }
  return html.replace(/<table>/g,'<div class="tablewrap"><table>').replace(/<\/table>/g,'</table></div>');
}
const backlinks = {};
function parsePage(txt){
  const m = txt.replace(/\r\n/g,"\n").match(/^---\n([\s\S]*?)\n---\n([\s\S]*)$/);
  if (!m) return null;
  const fm = {};
  for (const line of m[1].split("\n")){
    const i = line.indexOf(":"); if (i<0) continue;
    const k = line.slice(0,i).trim(), v = line.slice(i+1).trim();
    fm[k] = v.startsWith("[") ? v.slice(1,-1).split(",").map(x=>x.trim()).filter(Boolean) : v;
  }
  return {title:fm.title, type:fm.type||"concept", sources:fm.sources||[], updated:fm.updated||"", body:m[2]};
}
async function load(){
  const list = await (await fetch("wiki/pages.json",{cache:"no-cache"})).json();
  const texts = await Promise.all(list.map(p => fetch("wiki/"+encodeURI(p),{cache:"no-cache"}).then(r => r.ok ? r.text() : "")));
  texts.forEach(txt => { const p = parsePage(txt); if (p && p.title){ PAGES[p.title] = p; order.push(p.title); } });
  for (const t of order){ for (const m of PAGES[t].body.matchAll(/\[\[(.+?)\]\]/g)){ (backlinks[m[1]] ||= new Set()).add(t); } }
}

function statusBlock(){
  const now = new Date(), fmt = d => d.toLocaleString("zh-TW",{timeZone:"Asia/Taipei",month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit",hour12:false});
  const left = d => { const ms=d-now, h=Math.floor(ms/3600000), m=Math.floor(ms%3600000/60000); return h>=24?`還有 ${Math.floor(h/24)} 天 ${h%24} 小時`:`還有 ${h} 小時 ${m} 分`; };
  if (now < DEADLINES.online) return `<div class="status"><b>開放申請中</b><span>線上申請截止 ${fmt(DEADLINES.online)}（${left(DEADLINES.online)}）；紙本收件截止 ${fmt(DEADLINES.paper)}。</span></div>`;
  if (now < DEADLINES.paper) return `<div class="status"><b>線上申請已截止，紙本今天 17:00 前要交</b><span>紙本收件截止 ${fmt(DEADLINES.paper)}（${left(DEADLINES.paper)}），交到行政大樓三樓原資中心。</span></div>`;
  return `<div class="status closed"><b>本學期申請已截止</b><span>紙本收件已於 ${fmt(DEADLINES.paper)} 截止。下學期期程請留意原資中心公告。</span></div>`;
}

function buildNav(current){
  const box = document.getElementById("navlist"); let h = "";
  h += `<div class="navgroup"><ul><li><a href="#/總覽" ${current==="總覽"?'aria-current="page"':''}>總覽</a></li><li><a href="#/index" ${current==="index"?'aria-current="page"':''}>全部條目</a></li></ul></div>`;
  for (const [type,name] of GROUPS){
    const items = order.filter(t => PAGES[t].type===type && t!=="總覽" && t!=="index");
    if (!items.length) continue;
    h += `<div class="navgroup"><h2>${name}</h2><ul>` + items.map(t=>`<li><a href="#/${encodeURIComponent(t)}" ${t===current?'aria-current="page"':''}>${esc(label(t).replace(/^來源-/,""))}</a></li>`).join("") + "</ul></div>";
  }
  box.innerHTML = h;
}


// ---------- 搜尋 ----------
const STOPCH = new Set([..."嗎呢吧啊的了是我你妳他她要有在能會可以和與及或問什麼怎如何哪裡多少還都也就嗎那這個些想該"]);
const SYN = [[/研究所|研究生|碩士|博士/g,"碩博士"],[/多少錢|金額多少|領多少|幾塊/g,"金額"],[/期限|最後一天|deadline/gi,"截止"],[/低收入|中低收|低收/g,"低收入戶"],[/影本|copy/gi,"影本"],[/服務時數|時數/g,"時數"],[/達悟/g,"雅美"],[/一起|同時|兩個都|都領|兼領/g,"同時"],[/原資中心|原資/g,"原住民族學生資源中心"]];
let IDX = null;
const plain = md => md.replace(/^---[\s\S]*?---/,"").replace(/\[\[(.+?)\]\]/g,"$1").replace(/!\[[^\]]*\]\([^)]*\)/g,"").replace(/\[([^\]]+)\]\([^)]*\)/g,"$1").replace(/^\s*(?:[-+]|\d+\.)\s+/gm,"").replace(/[#*|`>]/g," ").replace(/-{3,}/g," ");
function buildIndex(){
  const norm = x => SYN.reduce((a, [re, to]) => a.replace(re, to), x).toLowerCase();
  const docs = order.filter(t => t !== "index" && t !== "log").map(t => ({t, text: norm(label(t) + "\n" + plain(PAGES[t].body)), raw: plain(PAGES[t].body)}));
  IDX = {docs, N: docs.length, maxIdf: Math.log((docs.length + 1) / 0.5)};
}
const idfOf = k => { const df = IDX.docs.filter(d => d.text.includes(k)).length; return df ? Math.log((IDX.N + 1) / (df + 0.5)) : 0; };
function units(q){
  // 把問題切成「字」單位：中文逐字、英數整段；每個字附上可能的雙字詞
  for (const [re, to] of SYN) q = q.replace(re, to);
  const out = [];
  for (const run of (q.toLowerCase().match(/[\u3400-\u9fff]+|[a-z0-9]+/g) || [])){
    if (/^[a-z0-9]+$/.test(run)){ out.push({ch: run, keys: [run], stop: false}); continue; }
    [...run].forEach((c, i, arr) => out.push({ch: c, stop: STOPCH.has(c), keys: [i > 0 ? arr[i-1] + c : null, i < arr.length - 1 ? c + arr[i+1] : null].filter(Boolean)}));
  }
  return out;
}
function search(q){
  if (!IDX) buildIndex();
  const us = units(q).filter(u => !u.stop);
  if (!us.length) return {hits: []};
  const idf = {}; us.forEach(u => u.keys.forEach(k => { if (!(k in idf)) idf[k] = idfOf(k); }));
  // 每個字的權重：能在 wiki 找到的詞用它的稀有度；連續兩字以上都找不到（像「宿舍」）給最高權重，代表 wiki 沒有這個主題
  us.forEach(u => { u.known = u.keys.filter(k => idf[k] > 0); u.w = u.known.length ? Math.max(...u.known.map(k => idf[k])) : 1; });
  us.forEach((u, i) => { if (!u.known.length && ((us[i-1] && !us[i-1].known.length) || (us[i+1] && !us[i+1].known.length))) u.w = IDX.maxIdf; });
  const total = us.reduce((a, u) => a + u.w, 0);
  const hits = [];
  for (const d of IDX.docs){
    let got = 0; const found = new Set();
    for (const u of us){ const k = u.known.filter(k => d.text.includes(k)); if (k.length){ got += u.w; k.forEach(x => found.add(x)); } }
    if (!found.size) continue;
    let sc = got / total;
    if ([...found].some(k => label(d.t).toLowerCase().includes(k))) sc += 0.08;
    if (PAGES[d.t].type === "source") sc -= 0.05;
    hits.push({...d, sc, found: [...found]});
  }
  hits.sort((a, b) => b.sc - a.sc);
  const best = hits.length ? hits[0].sc : 0;
  return {hits: best < 0.55 ? [] : hits.filter(h => h.sc >= Math.max(0.4, best * 0.7)).slice(0, 6)};
}
function snippet(h){
  const parts = h.raw.split(/(?<=[。；！？])|\n+/).map(x => x.trim()).filter(x => x.length > 3);
  let best = parts[0] || "", bs = -1;
  for (const p of parts){ const lp = p.toLowerCase(); const v = h.found.filter(k => lp.includes(k)).length; if (v > bs){ bs = v; best = p; } }
  if (best.length > 110) best = best.slice(0, 110) + "…";
  const re = new RegExp(h.found.slice().sort((a,b)=>b.length-a.length).map(k => k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|"), "gi");
  return esc(best).replace(re, m => `<mark>${m}</mark>`);
}
function askBox(v){ return `<form class="askbox" role="search" data-ask><input name="q" type="search" value="${esc(v||"")}" placeholder="問原住民族事務或校園生活，例如：成績 65 分可以申請嗎" aria-label="搜尋 wiki"><button type="submit">搜尋</button></form>`; }
const NODATA = `這個 wiki 目前只收錄 115 學年度第 1 學期原民會大專獎助學金的公告，以及政大原住民學生獎助學金作業要點。可以換個說法或關鍵字再試一次，或直接聯絡原資中心：電話 (02) 2939-3091 分機 67030、信箱 isrc@nccu.edu.tw。`;
let askSeq = 0;
function keywordHtml(hits, withHead){
  if (!hits.length) return "";
  return (withHead ? `<h2 class="subhead">相關條目</h2>` : "") + `<ul class="hits">` + hits.map(x => `<li><a class="t" href="#/${encodeURIComponent(x.t)}">${esc(label(x.t))}</a><p>${snippet(x)}</p></li>`).join("") + `</ul>`;
}
function nodataHtml(){
  return `<div class="nodata"><b>目前沒有這方面的資料</b>${NODATA}</div><p>也可以從這些條目開始看：<a class="wl" href="#/總覽">總覽</a>、<a class="wl" href="#/我適合申請哪一種">我適合申請哪一種</a>、<a class="wl" href="#/index">全部條目</a>。</p>`;
}
async function askAI(q, seq, hits){
  const box = document.getElementById("ai"), rest = document.getElementById("kw");
  const done = () => seq === askSeq && box;
  try {
    const r = await fetch(ASK_API, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({question: q})});
    const d = await r.json().catch(() => ({}));
    if (!done()) return;
        if (d.error === "question_too_long") throw new Error("問題太長了，請精簡到 200 字以內。");
    if (!r.ok || d.error) throw new Error("AI 回答暫時無法使用，先看下方的關鍵字搜尋結果。");
    const status = d.status || (d.found ? "answered" : "no_data");
    if (status === "off_topic"){
      box.className = "ai offtopic";
      box.innerHTML = `<h2>不在服務範圍</h2><p class="ans">${esc(d.answer || "")}</p>`;
      rest.innerHTML = `<p>可以從這些條目開始看：<a class="wl" href="#/總覽">總覽</a>、<a class="wl" href="#/我適合申請哪一種">我適合申請哪一種</a>、<a class="wl" href="#/index">全部條目</a>。</p>`;
      return;
    }
    const srcs = (d.sources || []).filter(t => PAGES[t]);
    box.className = "ai" + (status === "answered" ? "" : " nodata-ai");
    box.innerHTML = `<h2>${status === "answered" ? "AI 回答" : "目前沒有這方面的資料"}</h2><p class="ans">${esc(d.answer || "").replace(/\n/g,"<br>")}</p>`
      + (srcs.length ? `<p class="src">依據：${srcs.map(t => `<a class="wl" href="#/${encodeURIComponent(t)}">${esc(label(t))}</a>`).join("、")}</p>` : "")
      + `<p class="note">由 AI 根據本 wiki 整理，可能有誤，請以原資中心與原民會正式公告為準。</p>`;
    if (status !== "answered" && !hits.length) rest.innerHTML = `<p>也可以從這些條目開始看：<a class="wl" href="#/總覽">總覽</a>、<a class="wl" href="#/我適合申請哪一種">我適合申請哪一種</a>、<a class="wl" href="#/index">全部條目</a>。</p>`;
  } catch (e) {
    if (!done()) return;
    box.className = "ai";
    box.innerHTML = `<p class="wait">${esc(e.message && !/fetch|network/i.test(e.message) ? e.message : "AI 回答暫時無法使用，先看下方的關鍵字搜尋結果。")}</p>`;
    if (!hits.length) rest.innerHTML = nodataHtml();
  }
}
function showSearch(q){
  const {hits} = search(q);
  const seq = ++askSeq;
  let h = `<div class="crumb">搜尋</div><h1>「${esc(q)}」的搜尋結果</h1>` + askBox(q);
  if (ASK_API){
    h += `<section class="ai" id="ai" aria-live="polite"><p class="wait">正在讀 wiki、整理回答…</p></section><div id="kw">${keywordHtml(hits, true)}</div>`;
  } else {
    h += hits.length ? keywordHtml(hits, false) : nodataHtml();
  }
  document.getElementById("art").innerHTML = h;
  document.getElementById("side").innerHTML = "";
  document.title = `搜尋：${q}｜原民會獎助學金 LLM Wiki`;
  buildNav(null);
  if (ASK_API) askAI(q, seq, hits);
}
document.addEventListener("submit", e => {
  const f = e.target; if (f.id !== "qform" && !f.hasAttribute("data-ask")) return;
  e.preventDefault();
  const v = (f.id === "qform" ? document.getElementById("q") : f.elements.q).value.trim();
  if (v) location.hash = "#search=" + encodeURIComponent(v);
});

function show(){
  const sm = location.hash.match(/^#search=(.*)$/);
  if (sm){ const q = decodeURIComponent(sm[1]); document.getElementById("q").value = q; showSearch(q); window.scrollTo(0,0); document.getElementById("nav").classList.remove("open"); return; }
  let t = decodeURIComponent(location.hash.replace(/^#\/?/,"")) || "總覽";
  if (!PAGES[t]) t = "總覽";
  const p = PAGES[t];
  let html = "";
  if (t==="總覽") html += statusBlock() + askBox("");
  html = render(p.body).replace(/(<h1>.*?<\/h1>)/, "$1"+html);
  const typeName = (GROUPS.find(g=>g[0]===p.type)||[,""])[1];
  document.getElementById("art").innerHTML = (typeName && t!=="總覽" ? `<div class="crumb">${typeName}</div>` : "") + html;
  let s = "";
  const bl = [...(backlinks[t]||[])].filter(x=>x!==t && x!=="index" && x!=="log");
  if (bl.length) s += `<h3>連到這裡的條目</h3><ul>${bl.map(x=>`<li><a class="wl" href="#/${encodeURIComponent(x)}">${esc(label(x))}</a></li>`).join("")}</ul>`;
  if (p.sources && p.sources.length) s += `<h3>依據來源</h3><ul>${p.sources.map(x=>`<li><a class="wl" href="#/${encodeURIComponent(x)}">${esc(x.replace(/^來源-/,""))}</a></li>`).join("")}</ul>`;
  if (p.updated) s += `<h3>更新</h3><p class="meta">${p.updated}</p>`;
  document.getElementById("side").innerHTML = s;
  document.title = (t==="總覽"?"":label(t)+"｜") + "原民會獎助學金 LLM Wiki";
  buildNav(t);
  window.scrollTo(0,0);
  const nav = document.getElementById("nav"); nav.classList.remove("open"); document.getElementById("menubtn").setAttribute("aria-expanded","false");
}
document.getElementById("menubtn").addEventListener("click", e => {
  const nav = document.getElementById("nav"); const open = nav.classList.toggle("open"); e.target.setAttribute("aria-expanded", open);
});
(function(){
  const root = document.documentElement;
  try { const s = localStorage.getItem("theme"); if (s) root.dataset.theme = s; } catch(e){}
  document.getElementById("themebtn").addEventListener("click", () => {
    const dark = root.dataset.theme ? root.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem("theme", root.dataset.theme); } catch(e){}
  });
})();
window.addEventListener("hashchange", show);
load().then(show).catch(() => {
  document.getElementById("art").innerHTML = `<h1>讀不到 wiki 內容</h1><p>這個網頁要透過網站伺服器開啟，直接雙擊 index.html 會讀不到 Markdown 檔。部署到網路上，或在資料夾裡執行 <code>python -m http.server</code> 再開 http://localhost:8000 即可。</p>`;
});
</script>
